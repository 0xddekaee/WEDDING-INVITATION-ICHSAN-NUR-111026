<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin RSVP — Ichsan & Nur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lockScreen">
        <div class="lock-content">
            <div class="lock-logo"><i class="fa-solid fa-heart"></i></div>
            <h1>Admin RSVP</h1>
            <p style="color:#a8988a; margin-bottom:2rem;">Ichsan &amp; Nur</p>
            <input type="password" id="adminToken" class="form-control lock-input" placeholder="Masukkan token admin" autocomplete="off">
            <button class="btn btn-gold w-100" id="unlockBtn">Buka Dashboard</button>
            <p id="lockError" class="lock-error">Token salah. Coba lagi.</p>
        </div>
    </div>

    <div id="adminApp" style="display:none;">
        <header class="admin-header">
            <div class="container-fluid px-4 py-3 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <a href="index.html" class="admin-title">
                        <i class="fa-solid fa-heart me-2"></i>
                        <span>RSVP Dashboard</span>
                    </a>
                    <span class="admin-subtitle">Ichsan &amp; Nur</span>
                </div>
                <button class="btn btn-sm btn-outline-danger" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>Keluar
                </button>
            </div>
        </header>

        <main class="container-fluid px-4 py-4">
            <div class="stats-grid">
                <div class="stat-card all">
                    <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Total RSVP</div>
                </div>
                <div class="stat-card hadir">
                    <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="stat-value" id="statHadir">0</div>
                    <div class="stat-label">Hadir</div>
                </div>
                <div class="stat-card ragu">
                    <div class="stat-icon"><i class="fa-solid fa-circle-question"></i></div>
                    <div class="stat-value" id="statRagu">0</div>
                    <div class="stat-label">Masih Ragu</div>
                </div>
                <div class="stat-card tidak">
                    <div class="stat-icon"><i class="fa-solid fa-circle-xmark"></i></div>
                    <div class="stat-value" id="statTidak">0</div>
                    <div class="stat-label">Tidak Hadir</div>
                </div>
            </div>

            <div class="card controls-bar">
                <div class="row g-3 align-items-center">
                    <div class="col-md-4">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchBox" placeholder="Cari nama tamu...">
                            <button class="btn btn-outline-secondary" type="button" id="searchBtn">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="filterStatus">
                            <option value="all">Semua Status</option>
                            <option value="hadir">Hadir</option>
                            <option value="tidak hadir">Tidak Hadir</option>
                            <option value="masih ragu">Masih Ragu</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="sortOrder">
                            <option value="newest">Terbaru dulu</option>
                            <option value="oldest">Terlama dulu</option>
                        </select>
                    </div>
                    <div class="col-md-4 d-flex gap-2">
                        <button class="btn btn-outline-danger btn-sm" id="deleteAllBtn">
                            <i class="fa-solid fa-trash-can me-1"></i>Hapus Semua
                        </button>
                        <button class="btn btn-gold btn-sm ms-auto" id="refreshBtn">
                            <i class="fa-solid fa-rotate-left me-1"></i>Refresh
                        </button>
                    </div>
                </div>
            </div>

            <div class="card table-card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nama</th>
                                <th>Status</th>
                                <th>Ucapan</th>
                                <th>Waktu</th>
                                <th class="text-end">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="rsvpTableBody">
                            <tr><td colspan="6" class="text-center py-4" style="color:#a8988a;">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <div class="toast-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
